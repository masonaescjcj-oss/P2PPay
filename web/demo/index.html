<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>%VITE_APP_NAME% آزمایشی</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='9' fill='%2317132e'/%3E%3Crect x='9' y='9' width='16' height='16' fill='none' stroke='%23aea3ff' stroke-width='1.8'/%3E%3Crect x='9' y='9' width='16' height='16' fill='none' stroke='%23aea3ff' stroke-width='1.8' transform='rotate(45 17 17)'/%3E%3Ccircle cx='17' cy='17' r='3.5' fill='%236a5af9'/%3E%3C/svg%3E" />
    <style>
      /* Loading screen until the in-browser server is ready (dark-first, like the app). */
      :root { --boot-bg: #080c1c; --boot-fg: #c9cfe3; --boot-accent: #e9b44c; --boot-bad: #f2907c; color-scheme: dark; }
      @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --boot-bg: #f6f2e9; --boot-fg: #3b4468; --boot-accent: #9a6a0e; --boot-bad: #b4452f; color-scheme: light; } }
      :root[data-theme="light"] { --boot-bg: #f6f2e9; --boot-fg: #3b4468; --boot-accent: #9a6a0e; --boot-bad: #b4452f; color-scheme: light; }
      body { background: var(--boot-bg); }
      #boot { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding-inline: 16px; text-align: center; color: var(--boot-fg); font: 15px/1.9 Vazirmatn, Tahoma, system-ui, sans-serif; }
      #boot .mark { width: 44px; height: 44px; border: 2px solid var(--boot-accent); transform: rotate(45deg); }
      #boot.failed { color: var(--boot-bad); }
      @media (prefers-reduced-motion: no-preference) { #boot:not(.failed) .mark { animation: boot-spin 2.4s linear infinite; } }
      @keyframes boot-spin { to { transform: rotate(405deg); } }
    </style>
  </head>
  <body>
    <div id="boot"><div class="mark"></div><div id="boot-text"></div></div>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
